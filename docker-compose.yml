

services:
  mongo:
    image: mongo:7
    container_name: apnidukaan-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - apnidukaan-network

  redis:
    image: redis:7-alpine
    container_name: apnidukaan-redis
    restart: unless-stopped
    networks:
      - apnidukaan-network

  kafka:
    image: apache/kafka:4.1.1
    container_name: apnidukaan-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - apnidukaan-network

  cart-service:
    image: muhammedhassan21/apnidukaan-cart-service:latest
    container_name: apnidukaan-cart
    restart: unless-stopped
    ports:
      - "4005:4005"
    environment:
      NODE_ENV: production
      PORT: 4005
      MONGODB_URI: mongodb://mongo:27017/apnidukaan_cart
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-change-this-secret}
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - mongo
      - redis
    networks:
      - apnidukaan-network

  api-gateway:
    image: muhammedhassan21/apnidukaan-api-gateway:latest
    container_name: apnidukaan-api-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/apnidukaan
      FRONTEND_URL: http://localhost:3000
      FRONTEND_ORIGIN: http://localhost:3000
      RAZORPAY_ENABLED: "false"
    depends_on:
      - mongo
    networks:
      - apnidukaan-network

  frontend:
    image: muhammedhassan21/apnidukaan-frontend:latest
    container_name: apnidukaan-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: http://localhost:3000
    networks:
      - apnidukaan-network

  catalog-service:
    image: muhammedhassan21/apnidukaan-catalog-service:latest
    container_name: apnidukaan-catalog
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      NODE_ENV: production
      PORT: 4001
      MONGODB_URI: mongodb://mongo:27017/apnidukaan
      FRONTEND_URL: http://localhost:3000
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: apnidukaan-catalog
    depends_on:
      mongo:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - apnidukaan-network

  order-service:
    image: muhammedhassan21/apnidukaan-order-service:latest
    container_name: apnidukaan-order
    restart: unless-stopped
    ports:
      - "4003:4003"
    environment:
      NODE_ENV: production
      PORT: 4003
      FRONTEND_URL: http://localhost:3000
    networks:
      - apnidukaan-network

  payment-service:
    image: muhammedhassan21/apnidukaan-payment-service:latest
    container_name: apnidukaan-payment
    restart: unless-stopped
    ports:
      - "4004:4004"
    environment:
      NODE_ENV: production
      PORT: 4004
      FRONTEND_URL: http://localhost:3000
    networks:
      - apnidukaan-network

  search-service:
    image: muhammedhassan21/apnidukaan-search-service:latest
    container_name: apnidukaan-search
    restart: unless-stopped
    ports:
      - "4006:4006"
    environment:
      NODE_ENV: production
      PORT: 4006
      MONGODB_URI: mongodb://mongo:27017/apnidukaan_search
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - mongo
    networks:
      - apnidukaan-network

  notification-service:
    image: muhammedhassan21/apnidukaan-notification-service:latest
    container_name: apnidukaan-notification
    restart: unless-stopped
    ports:
      - "4007:4007"
    environment:
      NODE_ENV: production
      PORT: 4007
      MONGODB_URI: mongodb://mongo:27017/apnidukaan
      FRONTEND_URL: http://localhost:3000
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@apnidukaan.com}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_API_URL: ${SMS_API_URL:-https://api.textlocal.in/send/}
    depends_on:
      - mongo
    networks:
      - apnidukaan-network

  order-management-service:
    image: muhammedhassan21/apnidukaan-order-management-service:latest
    container_name: apnidukaan-order-management
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      MONGODB_URI: mongodb://mongo:27017/apnidukaan_orders
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: info
    depends_on:
      - mongo
      - redis
    networks:
      - apnidukaan-network

  user-service:
    image: muhammedhassan21/apnidukaan-user-service:latest
    container_name: apnidukaan-user
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      NODE_ENV: production
      PORT: 4002
      MONGODB_URI: mongodb://mongo:27017/apnidukaan_users
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-test-only-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-test-only-refresh-secret}
    depends_on:
      - mongo
    networks:
      - apnidukaan-network

volumes:
  mongo_data:
  kafka_data:

networks:
  apnidukaan-network:
    driver: bridge
